pleased:
  social:
    providers:
      facebook:
        handshake: META_CHALLENGE
        signature: HMAC
        signature-header: X-Hub-Signature-256
        split: "entry[*].messaging[*].message.text"
        account-key-source: JSON
        account-key-path: "value.metadata.phone_number_id"
      instagram:
        handshake: NONE
        signature: NONE
        split: "entry[*].messaging[*].message.text"
        account-key-source: PATH
      x:
        handshake: NONE
        signature: NONE
        split: "entry[*].messaging[*].message.text"
        account-key-source: PATH
